<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #d3 {
        display: flex;
        border: solid 2px;
        padding: 20px;
        background-color: #f4f7fb;
      }
      #d3 ul {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #d3 li {
        display: flex;
        border: 2px solid #376996;
        border-radius: 8px;
        padding: 14px 18px;
        background-color: #ffffff;
        color: #1f2937;
        font-family: Arial, sans-serif;
        font-weight: 600;
        align-items: center;
        justify-content: space-between;
        box-shadow: 3px 3px 0 #b8cbe0;
      }
      #d3 li:nth-child(even) {
        border-color: #d97706;
        box-shadow: 3px 3px 0 #f6c87a;
      }
    </style>
  </head>
  <body>
    <div id="d1">Sanjai</div>
    <div id="d2">Krishna</div>
    <div id="d3">
      <ul>
        <li id="l1">Item 1</li>
        <li id="l2">Item 2</li>
        <li id="l3">Item 3</li>
        <li id="l4">Item 4</li>
      </ul>
    </div>
  </body>
</html>
