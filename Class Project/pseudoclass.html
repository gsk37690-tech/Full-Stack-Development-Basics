<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #nameInput:focus {
        background-color: lightblue;
      }
      #myCheckbox:checked {
        background-color: lightgreen;
        outline: 10px solid lightgreen;
      }
      ol li {
        text-decoration: underline;
      }
      ul li {
        text-decoration: overline;
      }
      div ul li {
        text-decoration: hotpink;
      }
    </style>
  </head>
  <body>
    <input type="text" placeholder="Enter your name" id="nameInput" />
    <input type="checkbox" id="myCheckbox" />
    <div>
      <li>Trichy</li>
      <ul>
        <li>SRM</li>
      </ul>
    </div>

    <ul>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
    </ul>
    <ol>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
    </ol>
  </body>
</html>
