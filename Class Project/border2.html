<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .d1 {
        height: 50px;
        margin: 0px;
        width: 100px;
        border: 5px solid black;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: blue;
        position: relative;
      }
      .alert-dot {
        height: 20px;
        width: 20px;
        border: 2px solid white;
        border-radius: 50%;
        position: absolute;
        right: -10px;
        top: -10px;
        background-color: red;
      }
    </style>
  </head>
  <body>
    <div class="d1">
      <p
        style="
          margin: 0;
          color: white;
          font-weight: bold;
          font-family:
            &quot;Trebuchet MS&quot;, &quot;Lucida Sans Unicode&quot;,
            &quot;Lucida Grande&quot;, &quot;Lucida Sans&quot;, Arial,
            sans-serif;
        "
      >
        ALERTS
      </p>
      <div class="alert-dot"></div>
    </div>
  </body>
</html>
